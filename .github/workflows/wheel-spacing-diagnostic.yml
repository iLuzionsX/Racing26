name: Wheel spacing diagnostic

on:
  push:
    branches:
      - physics/chassis-suspension-coupling-spinout

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Measure bundled M5 mesh bounds
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          const dir='public/assets/bmw-m5-g90-default';
          const encoded=Array.from({length:8},(_,i)=>readFileSync(`${dir}/part-${String(i).padStart(2,'0')}.b64`,'utf8').trim()).join('').replace(/\s+/g,'');
          const b=gunzipSync(Buffer.from(encoded,'base64')); let o=0;
          const u8=()=>b[o++]; const u16=()=>{const v=b[o]|(b[o+1]<<8);o+=2;return v}; const i16=()=>{const v=u16();return v&0x8000?v-0x10000:v}; const u32=()=>{const v=(b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;o+=4;return v};
          const f32=()=>{const v=b.readFloatLE(o);o+=4;return v}; const str=()=>{const n=u8();const s=b.subarray(o,o+n).toString();o+=n;return s};
          const magic=String.fromCharCode(u8(),u8(),u8(),u8()); const version=u16(); const materialCount=u16(); const meshCount=u16();
          const materials=[]; for(let i=0;i<materialCount;i++) materials.push({name:str(),shader:str(),blend:i16()});
          const meshes=[];
          for(let m=0;m<meshCount;m++){const name=str(),mat=i16(),vc=u16(),ic=u32(); const minX=f32(),minY=f32(),minZ=f32(),maxX=f32(),maxY=f32(),maxZ=f32(); meshes.push({name,material:materials[mat]?.name??String(mat),minX,maxX,minY,maxY,minZ,maxZ,width:maxX-minX,height:maxY-minY,length:maxZ-minZ,centerX:(minX+maxX)/2}); o+=vc*3*2+ic*2;}
          const global={minX:Math.min(...meshes.map(x=>x.minX)),maxX:Math.max(...meshes.map(x=>x.maxX)),minY:Math.min(...meshes.map(x=>x.minY)),maxY:Math.max(...meshes.map(x=>x.maxY)),minZ:Math.min(...meshes.map(x=>x.minZ)),maxZ:Math.max(...meshes.map(x=>x.maxZ))};
          const paint=meshes.filter(x=>/carpaint|body|fender|bumper|door|quarter|hood|bonnet/i.test(x.material+' '+x.name));
          const paintBounds=paint.length?{minX:Math.min(...paint.map(x=>x.minX)),maxX:Math.max(...paint.map(x=>x.maxX)),minZ:Math.min(...paint.map(x=>x.minZ)),maxZ:Math.max(...paint.map(x=>x.maxZ))}:null;
          console.log(JSON.stringify({magic,version,meshCount,global:{...global,width:global.maxX-global.minX,centerX:(global.minX+global.maxX)/2},paintBounds:paintBounds&&{...paintBounds,width:paintBounds.maxX-paintBounds.minX,centerX:(paintBounds.minX+paintBounds.maxX)/2},widest:meshes.sort((a,b)=>b.width-a.width).slice(0,20)},null,2));
          NODE
      - name: Measure dynamic hub excursion
        run: |
          npx tsx -e "import {Simulation} from './src/physics/Simulation.ts'; import {DEFAULT_VEHICLE_CONFIG} from './src/physics/vehiclePresets.ts'; import {BMW_M5_2025_OVERRIDES} from './src/physics/m5G90.ts'; const c={...DEFAULT_VEHICLE_CONFIG,...BMW_M5_2025_OVERRIDES}; const neutral={throttle:0,brake:0,handbrake:false,shiftUp:false,shiftDown:false}; for(const [kmh,steer] of [[30,0.4],[60,0.18],[100,0.08],[160,0.04]] as const){const s=new Simulation(c as any);s.reset();s.vehicle.powertrain.isAutomatic=false;s.vehicle.powertrain.gear=0;const v=kmh/3.6;s.vehicle.rigidBody.velocity.z=v;for(const w of s.vehicle.wheels)w.angularVelocity=v/c.wheelRadius;for(let i=0;i<90;i++)s.stepExplicit({...neutral,steer:0},1);let maxOut=[0,0,0,0],maxRoll=0;for(let i=0;i<360;i++){const st=s.stepExplicit({...neutral,steer},1);maxRoll=Math.max(maxRoll,Math.abs(st.roll));st.wheels.forEach((w,j)=>{const h=(w as any).hubWorldPos;const dx=h.x-st.x,dz=h.z-st.z;const co=Math.cos(st.yaw),si=Math.sin(st.yaw);const lx=co*dx-si*dz;maxOut[j]=Math.max(maxOut[j],Math.abs(lx));});}console.log(JSON.stringify({kmh,steer,maxRollDeg:maxRoll*180/Math.PI,maxOutboardHubM:maxOut,nominalHalfTracks:[c.trackWidthFront/2,c.trackWidthFront/2,c.trackWidthRear/2,c.trackWidthRear/2],extraOutboardMm:maxOut.map((x,j)=>(x-[c.trackWidthFront/2,c.trackWidthFront/2,c.trackWidthRear/2,c.trackWidthRear/2][j])*1000)}));}"
