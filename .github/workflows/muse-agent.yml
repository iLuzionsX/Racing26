name: Muse Spark xhigh tyre pass

on:
  push:
    branches:
      - physics/tyre-response-corner-balance

permissions:
  contents: read

jobs:
  investigate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        agent:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run Muse investigation
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AGENT_ID: ${{ matrix.agent }}
        run: |
          node scripts/muse-agent/run.mjs --task "Agent $AGENT_ID of 8. Read .github/muse-task.txt first. This is a read-only investigation: patch must be null. Agent 1: independent abrupt-grip diagnosis. Agent 2: independent tire force-curve and combined-slip diagnosis. Agent 3: independent balance, transient and timestep diagnosis. Agent 4: configuration, reference-load and startup-determinism audit. Agent 5: steering, keyboard, on-screen wheel and assists audit. Agent 6: wheel loads, suspension, differential and drivetrain audit. Agent 7: baseline telemetry and automated-validation plan. Agent 8: direct-driving capability assessment and repeatable manual driving protocol. Only perform the assignment matching your agent number. Return reproduction, code paths, causal explanation, measurements or precise measurement plan, falsifier, smallest correction, and remaining uncertainty."
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-tyre-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
