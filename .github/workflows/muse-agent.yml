name: Muse Spark delegated agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: Focused engineering objective for the BMW M5 driving lab
        required: true
        type: string
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/muse-task.txt
      - .github/workflows/muse-agent.yml
      - scripts/muse-agent/zen.mjs
      - scripts/muse-agent/run.mjs

permissions:
  contents: read

jobs:
  verify-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Muse guardrails
        run: node scripts/muse-agent/test.mjs
      - name: Probe exact Muse runtime configuration
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          node scripts/muse-agent/run.mjs --task "CONFIGURATION PROBE ONLY. Return JSON with summary='config probe', patch=null, no proposed files, no tests, and no repository recommendations."
      - name: Require exact model and returned max effort
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = fs.readdirSync('.muse/artifacts').filter(x => x.endsWith('.json')).sort().at(-1);
          if (!file) throw new Error('Muse config probe produced no artifact.');
          const a = JSON.parse(fs.readFileSync('.muse/artifacts/' + file, 'utf8'));
          console.log(JSON.stringify({model:a.model, requested_reasoning_effort:a.requested_reasoning_effort, response_reasoning_effort:a.response_reasoning_effort}, null, 2));
          if (a.model !== 'muse-spark-1.3-contributor-free') throw new Error('Unexpected Muse model: ' + a.model);
          if (a.requested_reasoning_effort !== 'max') throw new Error('Muse request did not pin max reasoning.');
          if (a.response_reasoning_effort !== 'max') throw new Error('Provider did not confirm max reasoning; refusing fanout.');
          NODE

  investigate:
    needs: verify-config
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        agent: [1,2,3,4,5,6,7,8]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Muse guardrails
        run: node scripts/muse-agent/test.mjs
      - name: Run read-only investigation
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          BASE_TASK="$(cat .github/muse-task.txt)"
          case "${{ matrix.agent }}" in
            1) FOCUS="INDEPENDENT DIAGNOSIS A. Independently trace one reproducible abrupt-grip/spinout scenario from tire slip kinematics through tire forces and chassis response. Do not read or infer other agents' conclusions. Required evidence: reproduction, code paths, causal chain, measurements/measurement plan, falsifier, smallest correction." ;;
            2) FOCUS="INDEPENDENT DIAGNOSIS B. Independently investigate the same class of abrupt limit behavior, emphasizing pure/combined-slip force curves, peak/post-peak recovery, relaxation, and low-speed numerical transitions. Do not read or infer other agents' conclusions. Return the same required evidence." ;;
            3) FOCUS="INDEPENDENT DIAGNOSIS C. Independently investigate the same class of abrupt limit behavior, emphasizing front/rear balance, transient yaw/sideslip, load transfer, throttle/lift/brake interactions, and timestep dependence. Do not read or infer other agents' conclusions. Return the same required evidence." ;;
            4) FOCUS="CONFIGURATION AND INITIALIZATION. Audit tire parameters, units, defaults, front/rear assignments, startup determinism, reference loads, and any random/sampled startup state. Explicitly verify whether rear tire reference load is incorrectly sourced from the front and whether repeated identical starts can change grip. Treat both as hypotheses." ;;
            5) FOCUS="STEERING AND ASSISTS. Audit keyboard and on-screen wheel paths, steering ratio, speed sensitivity, filters/slew, opposite-lock behavior, stability assists, ABS/TCS interactions, and whether controls create or mask abrupt handling. Separate digital from analog behavior." ;;
            6) FOCUS="LOADS AND DRIVETRAIN. Audit per-wheel Fz, load sensitivity, suspension load transfer, differential/center coupling, torque distribution and signs. Look for discontinuities, force double-counting, axle unloading, or torque jumps that can upset corner balance." ;;
            7) FOCUS="BASELINE AND AUTOMATED VALIDATION. Own the proposed shared harness only: map existing telemetry/tests to the 10 requested validation maneuvers, identify exact files that one implementation owner should touch later, define before/after metrics and acceptance criteria derived from baseline/reference behavior rather than arbitrary pass thresholds. Diagnosis only now." ;;
            8) FOCUS="DRIVING ASSESSMENT. Determine what can and cannot be directly observed from the available environment. If browser interaction is unavailable, say so explicitly. Provide a repeatable keyboard + on-screen-wheel manual route, exact observable failure signatures, and telemetry that would distinguish understeer, rear rotation, snap-back, and control-path artifacts." ;;
          esac
          node scripts/muse-agent/run.mjs --task "Agent ${{ matrix.agent }} of 8. $FOCUS

$BASE_TASK"
      - name: Print Muse artifact
        if: always()
        run: |
          echo "===== MUSE_ARTIFACT_BEGIN agent=${{ matrix.agent }} ====="
          for file in .muse/artifacts/*.json; do [ -f "$file" ] && cat "$file"; done
          echo "===== MUSE_ARTIFACT_END agent=${{ matrix.agent }} ====="
      - name: Upload Muse artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-tyre-investigation-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
