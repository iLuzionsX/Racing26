name: Muse Spark xhigh tyre implementation

on:
  push:
    branches:
      - physics/tyre-response-corner-balance

permissions:
  contents: read

jobs:
  implement:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent:
          - 1
          - 2
          - 3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run Muse implementation review
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AGENT_ID: ${{ matrix.agent }}
        run: |
          node scripts/muse-agent/run.mjs --task "Agent $AGENT_ID of 3. Read .github/muse-task.txt first. Agent 1: tire-model implementer. Agent 2: transient/balance implementer. Agent 3: adversarial reviewer. Only perform your numbered assignment. You may propose a patch within policy; keep it minimal and include deterministic tests and falsifiers."
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-tyre-implementation-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
