name: Muse Spark xhigh tyre verification

on:
  push:
    branches:
      - physics/tyre-response-corner-balance

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent:
          - 1
          - 2
          - 3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run Muse adversarial verification
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AGENT_ID: ${{ matrix.agent }}
        run: |
          node scripts/muse-agent/run.mjs --task "This command is authoritative; .github files are intentionally excluded from the agent snapshot, so do not ask for or block on a task file. Verify the current branch after the WheelDynamics transient combined-slip limiter was changed from a single circular resultant clamp to the same axis-aware superellipse semantics returned by TireModel. Goal: progressive/readable/catchable limit behavior without changing peak grip, steering, yaw damping, assists, suspension, or drivetrain. Agent $AGENT_ID of 3: Agent 1 inspect TireModel + WheelDynamics for mathematical consistency, continuity, symmetry, and any force-limit regression. Agent 2 inspect full-car transient consequences: brake-release, throttle-on, countersteer, oversteer recovery, high-speed spin, load transfer and differential interactions; identify any mechanism that could make the change less stable or unrealistic. Agent 3 act as adversarial reviewer: try to falsify the change, look for low-speed/rolling-resistance/anisotropic-limit edge cases and telemetry-semantic errors, and propose a patch only for a clear defect. Do not tune grip or add hidden stabilization. Return exact files inspected, findings, tests/falsifiers, risks, and patch=null unless a concrete defect is proven."
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-tyre-verification-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
