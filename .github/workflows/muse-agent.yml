name: Muse Spark max chassis investigation

on:
  push:
    branches:
      - physics/chassis-suspension-coupling-spinout

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Probe exact Muse configuration
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: node scripts/muse-agent/run.mjs --task "Configuration probe only. Return valid JSON with summary config-probe and patch null."
      - name: Require Spark 1.3 max
        run: |
          node -e "const fs=require('fs');const p=fs.readdirSync('.muse/artifacts').filter(x=>x.endsWith('.json')).sort().pop();if(!p)throw Error('missing Muse artifact');const a=JSON.parse(fs.readFileSync('.muse/artifacts/'+p,'utf8'));console.log(JSON.stringify({model:a.model,requested:a.requested_reasoning_effort,response:a.response_reasoning_effort,status:a.status}));if(a.model!=='muse-spark-1.3-contributor-free'||a.requested_reasoning_effort!=='max'||a.response_reasoning_effort!=='max')throw Error('Muse Spark 1.3 max was not confirmed by provider');"

  investigate:
    needs: probe
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        agent: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run Muse chassis specialist
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AGENT_ID: ${{ matrix.agent }}
        run: |
          node scripts/muse-agent/run.mjs --task "Agent $AGENT_ID of 8. Read .github/muse-task.txt. Execute assignment number $AGENT_ID from that task exactly. Inspect the current branch and return the required evidence, falsifier, tests, risks, and a minimal unified diff only if a concrete defect is proven."
      - name: Require Spark 1.3 max
        run: |
          node -e "const fs=require('fs');const p=fs.readdirSync('.muse/artifacts').filter(x=>x.endsWith('.json')).sort().pop();if(!p)throw Error('missing Muse artifact');const a=JSON.parse(fs.readFileSync('.muse/artifacts/'+p,'utf8'));console.log(JSON.stringify({agent:process.env.AGENT_ID,model:a.model,requested:a.requested_reasoning_effort,response:a.response_reasoning_effort,status:a.status}));if(a.model!=='muse-spark-1.3-contributor-free'||a.requested_reasoning_effort!=='max'||a.response_reasoning_effort!=='max')throw Error('Muse Spark 1.3 max was not confirmed by provider');"
        env:
          AGENT_ID: ${{ matrix.agent }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muse-chassis-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
