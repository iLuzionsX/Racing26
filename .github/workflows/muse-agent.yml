name: Muse Spark 1.3 max chassis suspension pass

on:
  push:
    branches:
      - physics/chassis-suspension-coupling-spinout

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Probe Muse Spark 1.3 max
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: node scripts/muse-agent/run.mjs --task "CONFIGURATION PROBE ONLY. Return JSON with summary config-probe, patch null, no proposed files, no tests, and no recommendations."
      - name: Verify actual provider configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('.muse/artifacts').filter(x => x.endsWith('.json')).sort();
          if (!files.length) throw new Error('No Muse artifact');
          const a = JSON.parse(fs.readFileSync('.muse/artifacts/' + files[files.length - 1], 'utf8'));
          console.log(JSON.stringify({
            model: a.model,
            requested_reasoning_effort: a.requested_reasoning_effort,
            response_reasoning_effort: a.response_reasoning_effort,
            status: a.status
          }, null, 2));
          if (a.model !== 'muse-spark-1.3-contributor-free') throw new Error('Unexpected model: ' + a.model);
          if (a.requested_reasoning_effort !== 'max') throw new Error('Request did not use max');
          if (a.response_reasoning_effort !== 'max') throw new Error('Provider did not confirm max: ' + a.response_reasoning_effort);
          NODE

  investigate:
    needs: probe
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        agent: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run focused chassis investigation
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          BASE_TASK="$(cat .github/muse-task.txt)"
          case "${{ matrix.agent }}" in
            1) FOCUS="CHASSIS/UNSPRUNG COUPLING. Trace physical body, hub and contact states for frame divergence, double transforms, stale transforms, or lateral decoupling." ;;
            2) FOCUS="SUSPENSION KINEMATICS. Audit travel/roll/heave/hardpoint/body-frame transforms, bump stops and ARB behavior under combined roll+yaw." ;;
            3) FOCUS="NORMAL LOAD / TRANSFER. Audit per-wheel Fz, wheel unloading/lift, transfer chronology, clamping, and yaw impulses from transient load discontinuities." ;;
            4) FOCUS="FORCE APPLICATION. Audit tyre/contact force directions, coordinate frames, application points and moment arms for double-counting or abrupt sign/frame changes." ;;
            5) FOCUS="INTEGRATION / ORDERING. Audit fixed-step chronology, state mutation, suspension update order and render interpolation versus actual physics state." ;;
            6) FOCUS="SURFACE / CONTACT. Audit road normal/elevation/contact sampling in turns and kerb/runoff transitions after the jitter fix; seek physically meaningful discontinuities." ;;
            7) FOCUS="REPRO / REGRESSION. Build the strongest deterministic falsifier using chassis/hub/contact relative geometry, loads, yaw, sideslip and lateral G. Propose test patch if useful." ;;
            8) FOCUS="ADVERSARIAL INTEGRATOR. Challenge the user's apparent chassis-slip diagnosis, review interactions with PRs #124/#125/#126, rank mechanisms, and patch only a proven defect." ;;
          esac
          node scripts/muse-agent/run.mjs --task "Agent ${{ matrix.agent }} of 8. $FOCUS

$BASE_TASK"
      - name: Verify agent provider configuration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('.muse/artifacts').filter(x => x.endsWith('.json')).sort();
          if (!files.length) throw new Error('No Muse artifact');
          const a = JSON.parse(fs.readFileSync('.muse/artifacts/' + files[files.length - 1], 'utf8'));
          if (a.model !== 'muse-spark-1.3-contributor-free') throw new Error('Unexpected model: ' + a.model);
          if (a.requested_reasoning_effort !== 'max' || a.response_reasoning_effort !== 'max') {
            throw new Error('Muse reasoning effort was not max');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-chassis-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
