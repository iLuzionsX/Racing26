name: Muse Spark xhigh post-impact grip investigation

on:
  push:
    branches:
      - physics/chassis-suspension-coupling-spinout

permissions:
  contents: read

jobs:
  investigate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        agent: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/muse-agent/test.mjs
      - name: Run Muse Spark 1.3 xhigh investigation
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          AGENT_ID: ${{ matrix.agent }}
        run: |
          node scripts/muse-agent/run.mjs --task "User-reported defect on the current PR branch: after a crash, curb strike, large weight-transfer event, or other violent disturbance, the car can appear to permanently lose most/all grip. Diagnose a persistent-state or post-impact desynchronization defect. Do NOT raise grip, add yaw damping, auto-upright the car, hide the issue with assists, or reset normal driving state. Preserve PR-127 roll-center planar support work. Agent ${AGENT_ID} of 8 assignment: 1) CrashStability projection versus suspension world-state synchronization; 2) Suspension unsprung position/velocity recovery after chassis translation/rotation corrections; 3) WheelDynamics relaxation/transient/low-speed state recovery and distance-based freeze edge cases; 4) wheelContactAuthorityForUprightness and body attitude/contact gating after crash; 5) wheel angular velocity, ABS/TCS, differential and driveline persistent state after violent slip; 6) tire temperature/wear/slip-energy falsification—prove whether it can or cannot cause lasting grip loss; 7) design a deterministic regression that measures restored lateral force/cornering authority after an injected disturbance, not merely finite state; 8) adversarial integrator: rank mechanisms by evidence and propose the smallest physically justified patch. Inspect CrashStability.ts, Simulation.ts, Vehicle.ts, Suspension.ts, WheelDynamics.ts, DriverAids.ts, crash tests, and M5 tests. Return exact mechanism, falsifier, patch only if justified, and tests including test:crash, test:crash-recovery, test:m5-validation:strict."
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-post-impact-grip-agent-${{ matrix.agent }}
          path: .muse/artifacts/
          if-no-files-found: error
          retention-days: 7
