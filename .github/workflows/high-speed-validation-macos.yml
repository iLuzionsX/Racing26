name: High-speed steering validation (macOS)

on:
  push:
    branches:
      - fix/high-speed-steering-stability

permissions:
  contents: read

jobs:
  validate-high-speed:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Runtime wiring
        run: node scripts/app-runtime-wiring-check.mjs

      - name: Physics conventions
        run: npm run test:conventions

      - name: Digital steering
        run: npm run test:digital-steering

      - name: High-speed steering input
        run: npm run test:high-speed-steering

      - name: Digital steering FPS invariance
        run: npm run test:digital-steering-fps

      - name: Analog steering FPS invariance
        run: npm run test:analog-steering-fps

      - name: High-speed keyboard cornering
        run: npm run test:keyboard-cornering

      - name: M5 oversteer recovery
        run: npm run test:m5-oversteer

      - name: High-speed spin regression
        run: npm run test:high-speed-spin

      - name: Existing high-speed regression
        run: npm run test:high-speed

      - name: Strict M5 validation
        run: npm run test:m5-validation:strict

      - name: Production build
        run: npm run build -- --base=/Racing26/pr-125/
