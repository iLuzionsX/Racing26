name: Differential continuity validation

on:
  pull_request:
    branches:
      - main
    paths:
      - src/physics/Differential.ts
      - src/physics/tests/DifferentialContinuityTests.ts
      - package.json
      - .github/workflows/differential-continuity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Differential continuity
        run: npm run test:differential-continuity
      - name: Physics conventions
        run: npm run test:conventions
      - name: M5 RWD mode
        run: npm run test:m5-rwd
      - name: M5 transient
        run: npm run test:m5-transient
      - name: Strict M5 validation
        run: npm run test:m5-validation:strict
      - name: Production build
        run: npm run build
