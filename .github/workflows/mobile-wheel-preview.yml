name: Deploy combined Racing26 previews

on:
  push:
    branches:
      - feature/mobile-analog-steering-wheel

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-combined-previews
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout PR 51
        uses: actions/checkout@v4
        with:
          ref: handling-digital-driver-v2-integration
          path: pr51-src

      - name: Checkout PR 57
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-analog-steering-wheel-final
          path: pr57-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build production
        working-directory: main-src
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build -- --base=/Racing26/

      - name: Build PR 51
        working-directory: pr51-src
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build -- --base=/Racing26/pr-51/

      - name: Build PR 57
        working-directory: pr57-src
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build -- --base=/Racing26/pr-57/

      - name: Assemble Pages artifact
        run: |
          rm -rf site
          mkdir -p site/pr-51 site/pr-57
          cp -R main-src/dist/. site/
          cp -R pr51-src/dist/. site/pr-51/
          cp -R pr57-src/dist/. site/pr-57/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy combined previews
        id: deployment
        uses: actions/deploy-pages@v4
