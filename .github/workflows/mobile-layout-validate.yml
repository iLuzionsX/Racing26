name: Mobile layout validation

on:
  push:
    branches:
      - feature/mobile-analog-steering-wheel-final

permissions:
  contents: read

jobs:
  validate-mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Type-check mobile layout files
        run: >-
          npx tsc --noEmit
          --target ES2022
          --module ESNext
          --moduleResolution Bundler
          --jsx react-jsx
          --lib ES2022,DOM
          --types vite/client
          --skipLibCheck
          src/components/mobileControlLayout.ts
          src/components/MobileSteeringWheel.tsx
          src/components/MobileDrivingControls.tsx

      - name: Mobile control tests
        run: npm run test:mobile

      - name: PR 57 production build
        run: npm run build -- --base=/Racing26/pr-57/
