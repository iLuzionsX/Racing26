name: Handling integration validation

on:
  pull_request:
    branches:
      - main
    paths:
      - src/physics/**
      - src/App.tsx
      - package.json
      - .github/workflows/handling-integration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Physics conventions
        run: npm run test:conventions

      - name: Digital steering
        run: npm run test:digital-steering

      - name: Steering direction
        run: npm run test:steering-direction

      - name: Turn radius
        run: npm run test:turn-radius

      - name: Cornering
        run: npm run test:cornering

      - name: High-speed keyboard cornering
        run: npm run test:keyboard-cornering

      - name: M5 transient response
        run: npm run test:m5-transient

      - name: M5 oversteer recovery diagnostic
        run: npm run test:m5-oversteer

      - name: Strict M5 validation
        run: npm run test:m5-validation:strict

      - name: Showcase circuit QA
        run: npm run test:track

      - name: Production build
        run: npm run build
