name: GitHub Pages PR preview

on:
  push:
    branches:
      - main
    paths:
      - .github/pages-preview-ref.txt
      - .github/workflows/pages-preview.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-pr-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.target.outputs.slug }}
    steps:
      - name: Check out preview configuration
        uses: actions/checkout@v4

      - name: Read preview target
        id: target
        shell: bash
        run: |
          REF="$(sed -n 's/^ref=//p' .github/pages-preview-ref.txt | head -n 1)"
          SLUG="$(sed -n 's/^slug=//p' .github/pages-preview-ref.txt | head -n 1)"
          if [[ -z "$REF" || -z "$SLUG" ]]; then
            echo "preview ref/slug is missing" >&2
            exit 1
          fi
          if [[ ! "$SLUG" =~ ^pr-[0-9]+$ ]]; then
            echo "preview slug must look like pr-51" >&2
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: source
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build PR preview
        working-directory: source
        run: npm run build -- --base=/Racing26/${{ steps.target.outputs.slug }}/

      - name: Assemble Pages artifact
        shell: bash
        run: |
          mkdir -p "site/${{ steps.target.outputs.slug }}"
          cp -R source/dist/. "site/${{ steps.target.outputs.slug }}/"
          cat > site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./${{ steps.target.outputs.slug }}/">
          <title>Racing26 preview</title>
          <a href="./${{ steps.target.outputs.slug }}/">Open preview</a>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy PR preview
        id: deployment
        uses: actions/deploy-pages@v4
