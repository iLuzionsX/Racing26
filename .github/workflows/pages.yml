name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: App runtime wiring check
        run: node scripts/app-runtime-wiring-check.mjs

      - name: Muse guardrail self-test
        run: node scripts/muse-agent/test.mjs

      - name: Showcase Circuit drivability QA
        run: npm run test:track

      - name: Showcase Circuit visual QA
        run: npm run test:visual-track

      - name: Physics convention guardrails
        run: npm run test:conventions

      - name: Low-speed braking regression
        run: npm run test:low-speed-brake

      - name: Low-speed cornering regression
        run: npm run test:cornering

      - name: Suspension regression
        run: npm run test:suspension

      - name: Tire-model regression
        run: npm run test:tire

      - name: Hardened BMW M5 validation
        run: npm run test:m5-validation:strict

      - name: Upload M5 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-validation-suite
          path: artifacts/m5-validation/**
          if-no-files-found: warn
          retention-days: 7

      - name: Production build
        run: npm run build -- --base=/Racing26/

      - name: Assemble production site
        run: |
          rm -rf site
          mkdir -p site
          cp -R dist/. site/

      - name: Read optional PR preview target
        id: preview
        shell: bash
        run: |
          if [[ ! -f .github/pages-preview-ref.txt ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="$(sed -n 's/^ref=//p' .github/pages-preview-ref.txt | head -n 1)"
          SLUG="$(sed -n 's/^slug=//p' .github/pages-preview-ref.txt | head -n 1)"
          if [[ -z "$REF" || -z "$SLUG" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$SLUG" =~ ^pr-[0-9]+$ ]]; then
            echo "invalid preview slug: $SLUG" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Checkout PR preview source
        if: steps.preview.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.ref }}
          path: preview-source

      - name: Install PR preview dependencies
        if: steps.preview.outputs.enabled == 'true'
        working-directory: preview-source
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Check PR preview runtime wiring
        if: steps.preview.outputs.enabled == 'true'
        working-directory: preview-source
        run: node scripts/app-runtime-wiring-check.mjs

      - name: Build PR preview
        if: steps.preview.outputs.enabled == 'true'
        working-directory: preview-source
        run: npm run build -- --base=/Racing26/${{ steps.preview.outputs.slug }}/

      - name: Add PR preview to Pages artifact
        if: steps.preview.outputs.enabled == 'true'
        run: |
          mkdir -p "site/${{ steps.preview.outputs.slug }}"
          cp -R preview-source/dist/. "site/${{ steps.preview.outputs.slug }}/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
