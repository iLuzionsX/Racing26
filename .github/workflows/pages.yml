name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: App runtime wiring check
        run: node scripts/app-runtime-wiring-check.mjs

      - name: Muse guardrail self-test
        run: node scripts/muse-agent/test.mjs

      - name: Showcase Circuit drivability QA
        run: npm run test:track

      - name: Showcase Circuit visual QA
        run: npm run test:visual-track

      - name: Physics convention guardrails
        run: npm run test:conventions

      - name: Low-speed braking regression
        run: npm run test:low-speed-brake

      - name: Low-speed cornering regression
        run: npm run test:cornering

      - name: Suspension regression
        run: npm run test:suspension

      - name: Tire-model regression
        run: npm run test:tire

      - name: Hardened BMW M5 validation
        run: npm run test:m5-validation:strict

      - name: Upload M5 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-validation-suite
          path: artifacts/m5-validation/**
          if-no-files-found: warn
          retention-days: 7

      - name: Production build
        run: npm run build -- --base=/Racing26/

      - name: Assemble production site
        run: |
          rm -rf site
          mkdir -p site
          cp -R dist/. site/

      - name: Build configured PR previews
        shell: bash
        run: |
          set -euo pipefail

          PREVIEW_FILE=".github/pages-preview-refs.txt"
          LEGACY_FILE=".github/pages-preview-ref.txt"

          if [[ -f "$PREVIEW_FILE" ]]; then
            cp "$PREVIEW_FILE" /tmp/pages-preview-refs.txt
          elif [[ -f "$LEGACY_FILE" ]]; then
            REF="$(sed -n 's/^ref=//p' "$LEGACY_FILE" | head -n 1)"
            SLUG="$(sed -n 's/^slug=//p' "$LEGACY_FILE" | head -n 1)"
            if [[ -n "$REF" && -n "$SLUG" ]]; then
              printf '%s|%s\n' "$SLUG" "$REF" > /tmp/pages-preview-refs.txt
            else
              exit 0
            fi
          else
            exit 0
          fi

          while IFS='|' read -r SLUG REF; do
            [[ -z "$SLUG" || "$SLUG" == \#* ]] && continue

            if [[ ! "$SLUG" =~ ^pr-[0-9]+$ ]]; then
              echo "invalid preview slug: $SLUG" >&2
              exit 1
            fi
            if [[ ! "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "invalid preview ref: $REF" >&2
              exit 1
            fi

            DIR="_preview-$SLUG"
            rm -rf "$DIR"
            git fetch --no-tags origin "+refs/heads/$REF:refs/remotes/origin/$REF"
            git worktree add --detach "$DIR" "refs/remotes/origin/$REF"

            (
              cd "$DIR"
              npm install --no-package-lock --no-audit --no-fund
              node scripts/app-runtime-wiring-check.mjs
              npm run build -- --base="/Racing26/$SLUG/"
            )

            mkdir -p "site/$SLUG"
            cp -R "$DIR/dist/." "site/$SLUG/"
            git worktree remove --force "$DIR"
          done < /tmp/pages-preview-refs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
