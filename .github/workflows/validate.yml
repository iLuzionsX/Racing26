name: Validate Racing26

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: App runtime wiring check
        run: node scripts/app-runtime-wiring-check.mjs

      - name: Muse guardrail self-test
        run: node scripts/muse-agent/test.mjs

      - name: Showcase Circuit drivability QA
        run: npm run test:track

      - name: Showcase Circuit visual QA
        run: npm run test:visual-track

      - name: Physics convention guardrails
        run: npm run test:conventions

      - name: Digital steering unit regression
        run: npm run test:digital-steering

      - name: High-speed steering input regression
        run: npm run test:high-speed-steering

      - name: Digital steering render-FPS invariance
        run: npm run test:digital-steering-fps

      - name: Analog steering render-FPS invariance
        run: npm run test:analog-steering-fps

      - name: High-speed keyboard cornering
        run: npm run test:keyboard-cornering

      - name: M5 oversteer recovery
        run: npm run test:m5-oversteer

      - name: High-speed spin regression
        run: npm run test:high-speed-spin

      - name: High-speed suspension and load regression
        run: npm run test:high-speed

      - name: Mobile controls regression
        run: npm run test:mobile

      - name: Hand-wheel tire-feel sweep
        run: npm run test:tire-feel

      - name: Front differential corner-exit diagnostic
        run: npm run test:front-diff

      - name: Low-speed braking regression
        run: npm run test:low-speed-brake

      - name: Low-speed cornering regression
        run: npm run test:cornering

      - name: Suspension regression
        run: npm run test:suspension

      - name: Tire-model regression
        run: npm run test:tire

      - name: Hardened BMW M5 validation
        run: npm run test:m5-validation:strict

      - name: Production build
        run: npm run build -- --base=/Racing26/
