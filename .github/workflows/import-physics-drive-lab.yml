name: Import physics-drive-lab

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-physics-drive-lab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preserve import workflow
        uses: actions/checkout@v4
        with:
          path: target

      - name: Import public source snapshot without upstream workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          SOURCE="https://github.com/AtomNucleus/physics-drive-lab.git"
          TARGET="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          cp target/.github/workflows/import-physics-drive-lab.yml /tmp/import-physics-drive-lab.yml
          git clone --depth=1 "$SOURCE" source
          cd source
          SOURCE_SHA="$(git rev-parse HEAD)"

          rm -rf .git .github/workflows
          mkdir -p .github/workflows
          cp /tmp/import-physics-drive-lab.yml .github/workflows/import-physics-drive-lab.yml

          git init
          git switch -c main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import AtomNucleus/physics-drive-lab at ${SOURCE_SHA}"
          git remote add origin "$TARGET"
          git push --force origin main

          echo "Imported project snapshot from ${SOURCE_SHA}."
